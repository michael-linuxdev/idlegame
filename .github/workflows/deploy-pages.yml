name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Echte Spieler: nur veröffentlichen, was alle Prüfungen besteht
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Gartenerbe
        run: npm run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          echo 'idlegame.micana.de' > dist/CNAME
          grep -q 'assets/' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          grep -q 'Gartenerbe' dist/index.html
          test -f dist/pwa-192.png
          grep -q 'pwa-192' dist/manifest.webmanifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Actions GITHUB_TOKEN with pages:write can sometimes set cname when
      # local/integration tokens cannot (403). Best-effort; ignore failure.
      - name: Attach custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages -X PUT --input - <<'EOF'
          {
            "cname": "idlegame.micana.de",
            "build_type": "workflow",
            "https_enforced": true
          }
          EOF
          gh api repos/${{ github.repository }}/pages --jq '{cname,html_url,build_type,https_enforced}'
