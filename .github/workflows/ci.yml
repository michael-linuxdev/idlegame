name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (fresh start, Saisonende, sheets)
        run: npm run e2e
      - name: Balance smoke (engaged, 3 days)
        run: SUMMARY=1 npm run -s balance -- engaged 72
