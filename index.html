<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8f0e4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gartenerbe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Gartenerbe — vom Schrebergarten zum Gartenpark. Dein Garten wächst auch offline."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>Gartenerbe</title>
    <script>
      // Start-Bündel nicht geladen (z. B. Neuladen, während die vorige Seite
      // noch Bündel nachlud: der Browser bricht dann auch die gleichen Anfragen
      // der neuen Seite ab): einmal neu laden statt einer leeren Seite.
      // Gleiche Sperre wie src/game/chunkReload.ts (höchstens einmal je 60 s).
      addEventListener('load', function () {
        if (window.__gartenerbeStarted) return
        try {
          var key = 'gartenerbe-chunk-reload'
          var now = Date.now()
          if (now - Number(sessionStorage.getItem(key) || 0) < 60000) return
          sessionStorage.setItem(key, String(now))
        } catch (e) {
          return
        }
        location.reload()
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
